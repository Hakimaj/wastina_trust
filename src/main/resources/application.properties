# Digital Wastina Trust Protocol - Application Configuration

# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:mysql://localhost:3306/wastina_trust_db
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Naming Strategy - Snake Case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# JPA Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Timezone Configuration - Ethiopian Time
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Addis_Ababa

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.wastina.bussinesslogic.trust=DEBUG

# Character Encoding - UTF-8 for Amharic Support
spring.datasource.hikari.connection-init-sql=SET NAMES 'utf8mb4'
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
