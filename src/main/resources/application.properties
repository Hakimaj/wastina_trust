spring.application.name=trust-protocol
spring.datasource.url=${WASTINA_DATABASE_URL:jdbc:postgresql://localhost:5432/wastina_db}
spring.datasource.username=${WASTINA_DATABASE_USERNAME:wastina}
spring.datasource.password=${WASTINA_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${WASTINA_OIDC_ISSUER:http://localhost:8081/realms/wastina}
spring.security.oauth2.resourceserver.jwt.audiences=${WASTINA_OIDC_AUDIENCE:wastina-api}
