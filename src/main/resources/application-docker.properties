spring.datasource.url=jdbc:postgresql://postgres:5432/wastina_db
spring.datasource.username=wastina
spring.datasource.password=wastina_local_only

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

spring.neo4j.uri=bolt://neo4j:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8081/realms/wastina
spring.security.oauth2.resourceserver.jwt.audiences=wastina-api