spring.application.name=trust-protocol

server.port=${WASTINA_SERVER_PORT:8080}

spring.datasource.url=${WASTINA_DATABASE_URL:jdbc:postgresql://localhost:5432/wastina_db}
spring.datasource.username=${WASTINA_DATABASE_USERNAME:wastina}
spring.datasource.password=${WASTINA_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Production / OIDC. Keycloak (or any OIDC provider) signs the access tokens and
# the resource server validates them against the issuer's JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${WASTINA_OIDC_ISSUER:http://localhost:8081/realms/wastina}
spring.security.oauth2.resourceserver.jwt.audiences=${WASTINA_OIDC_AUDIENCE:wastina-api}

# Local development authentication. Disabled by default everywhere, including in the
# local profile: set WASTINA_DEV_JWT_ENABLED=true to turn it on. The startup guard
# rejects this flag under any production/staging profile.
wastina.dev.jwt.enabled=${WASTINA_DEV_JWT_ENABLED:false}
wastina.dev.jwt.issuer=${WASTINA_DEV_JWT_ISSUER:http://localhost/wastina-dev-issuer}
wastina.dev.jwt.audience=${WASTINA_DEV_JWT_AUDIENCE:wastina-api}
wastina.dev.jwt.secret=${WASTINA_DEV_JWT_SECRET:}
wastina.dev.jwt.ttl-seconds=${WASTINA_DEV_JWT_TTL_SECONDS:3600}

# Legacy switch, retained only so an old local setup fails loudly instead of silently
# losing authentication. Development authentication is now wastina.dev.jwt.enabled.
wastina.dev.auth-bypass=false

# ---------------------------------------------------------------------------
# CORS (browser preflight). Shared by the production and the local chain.
# Production origins come from WASTINA_CORS_ALLOWED_ORIGINS; the local development
# origin comes from WASTINA_FRONTEND_ORIGIN and is only added in the local/development
# profiles.
# ---------------------------------------------------------------------------
wastina.cors.allowed-origins=${WASTINA_CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------------
# API documentation
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.versions-to-open=3.0.3