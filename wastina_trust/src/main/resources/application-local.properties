# ---------------------------------------------------------------------------
# Local development profile. Works WITHOUT Keycloak.
# ---------------------------------------------------------------------------
spring.datasource.url=${WASTINA_DATABASE_URL:jdbc:postgresql://localhost:5432/wastina_db}
spring.datasource.username=${WASTINA_DATABASE_USERNAME:wastina}
spring.datasource.password=${WASTINA_DATABASE_PASSWORD:wastina_local_only}

# Schema management: local development lets Hibernate create and extend the schema, so a
# developer needs no migration baseline. The committed V1-V5 migrations ALTER a `users`
# table that they do not create, so they only apply to a database that already has it.
# See docs/architecture/schema-management.md before enabling Flyway here.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

# The development chain supplies its own JwtDecoder. Excluding the OIDC
# auto-configuration prevents Spring Boot from eagerly contacting Keycloak at startup.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Local signed-JWT authentication. No authorization server is required.
wastina.dev.jwt.enabled=${WASTINA_DEV_JWT_ENABLED:true}
wastina.dev.jwt.issuer=${WASTINA_DEV_JWT_ISSUER:http://localhost/wastina-dev-issuer}
wastina.dev.jwt.audience=${WASTINA_DEV_JWT_AUDIENCE:wastina-api}
wastina.dev.jwt.secret=${WASTINA_DEV_JWT_SECRET:local-development-only-signing-key-do-not-use-in-production}
wastina.dev.jwt.ttl-seconds=${WASTINA_DEV_JWT_TTL_SECONDS:3600}

# Development-only frontend origin (Vite default).
wastina.dev.cors.allowed-origin=${WASTINA_FRONTEND_ORIGIN:http://localhost:5173}
wastina.cors.allowed-origins=${WASTINA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password