# ---------------------------------------------------------------------------
# Test profile: H2 in PostgreSQL compatibility mode + the local signed-JWT mode.
# No Keycloak, no Postgres, no Neo4j required.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:wastina_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
# H2 maps Instant to a TIMESTAMP without a zone. Without this, Hibernate writes the instant in
# UTC but reads it back interpreted as the JVM default zone, which shifts every stored timestamp
# and makes expiry comparisons wrong. PostgreSQL, used in every real profile, is unaffected.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Use the local JWT chain, exactly as local development does.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

wastina.dev.jwt.enabled=true
wastina.dev.jwt.issuer=http://localhost/wastina-test-issuer
wastina.dev.jwt.audience=wastina-api
wastina.dev.jwt.secret=test-only-signing-key-at-least-32-characters-long
wastina.dev.jwt.ttl-seconds=3600

wastina.cors.allowed-origins=http://localhost:5173
wastina.dev.cors.allowed-origin=http://localhost:5173

springdoc.api-docs.enabled=false
management.endpoints.web.exposure.include=health,info

# Route unmatched URLs through the @RestControllerAdvice so they produce the standard ApiError
# envelope (404) instead of reaching the default servlet error path.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO